<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>iconeZERA</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="panel">
      <div class="toolbar">
        <div class="search">
          <div id="search-button" class="search-icon" title="">
            <svg viewBox="0 0 24 24" width="16" height="16"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M10.5 4a6.5 6.5 0 1 0 0 13a6.5 6.5 0 0 0 0-13Zm4.7 11.2L20 20"/></svg>
          </div>
          <input id="search-input" type="text" maxlength="80" />
        </div>
        <div id="language-button" class="btn quiet"><span id="language-code"></span></div>
      </div>
      <p id="status"></p>
      <div id="language-menu" hidden>
        <div id="language-list"></div>
        <p class="hint"><span id="language-hint"></span> <a id="language-mail" href="mailto:stephenson.silva@outlook.com">stephenson.silva@outlook.com</a></p>
      </div>
      <div id="content">
        <div id="suggestions">
          <p id="suggestions-title" class="label"></p>
          <div id="suggestion-list"></div>
        </div>
        <div id="grid"></div>
        <div id="loader" hidden></div>
        <div id="more" class="btn secondary" hidden></div>
      </div>
      <div class="tools">
        <div class="tool-row">
          <span id="color-label" class="tool-label"></span>
          <div id="swatch-foreground" class="swatch foreground"></div>
          <div id="swatches"></div>
          <input id="color-input" type="text" maxlength="7" spellcheck="false" />
        </div>
        <div class="tool-row">
          <span id="size-label" class="tool-label size-label"></span>
          <input id="size-input" type="text" maxlength="4" />
          <span class="unit">px</span>
          <span id="zoom-label" class="tool-label zoom-label"></span>
          <div class="zoom" data-zoom="s">S</div>
          <div class="zoom" data-zoom="m">M</div>
          <div class="zoom" data-zoom="l">L</div>
        </div>
      </div>
      <p id="footer"></p>
      <div id="toast" hidden></div>
    </div>
  </body>
  <script src="./index.js"></script>
</html>
